services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatguard-api
    ports:
      - "8000:8000"
    environment:
      - CHATGUARD_DB_PATH=/data/chatguard.db
      - CHATGUARD_RATE_LIMIT_REQUESTS=120
      - CHATGUARD_RATE_LIMIT_WINDOW_SECONDS=60
      - CHATGUARD_TRUST_PROXY_HEADERS=false
    volumes:
      - chatguard-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  chatguard-data:
